barrier_status_options: [confirmed_present, uncertain, absent_not_mentioned]
barrier_status_phrases:
  confirmed_present: [isolation was verified and tagged before work began, exclusion zone was established and maintained throughout, permit to work was signed off with all checks completed, gas test was conducted and confirmed safe prior to entry]
  uncertain: [isolation status was not clearly confirmed by the crew, exclusion zone markers were present but not actively enforced, permit was raised but supervisor sign-off could not be located, gas test reportedly done earlier in the shift, not re-verified]
  absent_not_mentioned: [no isolation was mentioned in the report, no exclusion zone was set up, work proceeded without a permit being sighted, ""]
exposure_phrases:
  direct_proximity: [a worker was standing within the immediate hazard zone, the contractor was positioned directly beneath the suspended load, personnel were within arm's reach of the live component, a technician was inside the equipment when work commenced]
  indirect_proximity: [a worker was nearby but not directly in the hazard path, personnel were in the general work area at the time]
  no_exposure: [no personnel were in the vicinity at the time, the area was clear of workers during the activity]
outcome_phrases: [No injury occurred., "No injury occurred; worker moved away in time.", Minor first aid case reported., "Near miss — situation was corrected before escalation.", Reported as unsafe condition during routine walk-around.]
sites: [Rig 4, Rig 7, Plant C, Well Site B, Field Station 2, Terminal A]