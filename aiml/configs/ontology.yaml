# -----------------------------------------------------------------------------
# 6. BARRIER STATUS — 4 states matching the reasoner's gap_severity ladder
# -----------------------------------------------------------------------------
barrier_status_options: [confirmed_present, uncertain, explicitly_absent, not_mentioned]

gap_severity:
  confirmed_present: 0.0
  uncertain: 0.6
  explicitly_absent: 1.0
  not_mentioned: null

exposure_options: [direct_proximity, indirect_proximity, no_exposure]

# -----------------------------------------------------------------------------
# 7. SIF-PRECURSOR DENSITY METRIC — documented and tunable, defaults equal.
#    Explicitly NOT presented as calibrated (Section 11 of the blueprint).
# -----------------------------------------------------------------------------
density_metric:
  calibrated: false
  note: "Weights default to equal and are tunable. To be calibrated jointly with OIL HSE SMEs against historical intervention outcomes."
  weights:
    w1_psif_rate: 0.25
    w2_pattern_recurrence: 0.25
    w3_energy_magnitude: 0.25
    w4_barrier_gap: 0.25
    reporting_culture_penalty: 0.10
